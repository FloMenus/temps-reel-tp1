<!DOCTYPE html>

<h1>Suivi de commande</h1>
<p>Statut : <span id="status"></span></p>

<script>
    const id = Number(new URLSearchParams(location.search).get("id"));
    const status = document.getElementById("status");

    fetch(`/orders/${id}`)
        .then((res) => res.json())
        .then((order) => status.textContent = order.status ?? order.error);

    const source = new EventSource("/stream");

    function update(e) {
        const order = JSON.parse(e.data);
        if (order.id === id) status.textContent = order.status;
    }

    source.addEventListener("order-status", update);
    source.addEventListener("order-cancelled", update);
</script>
